<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif"><title>First token and decode speed on CPU, GPU and NPU</title><desc>CPU: first token 2039 ms, decode 54.5 tok/s; GPU (Vulkan): first token 1000 ms, decode 42.1 tok/s; NPU (QNN): first token 407 ms, decode 24.8 tok/s</desc><text x="24.0" y="34.0" font-size="17" font-weight="600" fill="#1f2328" text-anchor="start">The NPU answers first and then writes slowest</text><text x="24.0" y="56.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Qwen3 1.7B served by ExecuServe on a Snapdragon 8 Elite Gen 5. Median of 3 requests each.</text><text x="24.0" y="96.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">First token after a ~700-token prompt</text><text x="24.0" y="113.0" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">ms, lower is better</text><text x="24.0" y="148.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">CPU</text><path d="M120.0,136.0 h139.5 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-139.5 z" fill="#2a78d6"/><text x="271.5" y="150.0" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">2,039 ms</text><text x="24.0" y="192.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">GPU (Vulkan)</text><path d="M120.0,180.0 h66.4 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-66.4 z" fill="#eb6834"/><text x="198.4" y="194.0" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">1,000 ms</text><text x="24.0" y="236.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">NPU (QNN)</text><path d="M120.0,224.0 h24.7 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-24.7 z" fill="#1baf7a"/><text x="156.7" y="238.0" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">407 ms</text><line x1="120.0" y1="128.0" x2="120.0" y2="264.0" stroke="#d1d9e0" stroke-width="1"/><text x="400.0" y="96.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Writing speed after a 21-token prompt</text><text x="400.0" y="113.0" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">tokens/s, higher is better</text><text x="400.0" y="148.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">CPU</text><path d="M496.0,136.0 h156.0 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-156.0 z" fill="#2a78d6"/><text x="664.0" y="150.0" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">54.5</text><text x="400.0" y="192.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">GPU (Vulkan)</text><path d="M496.0,180.0 h119.5 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-119.5 z" fill="#eb6834"/><text x="627.5" y="194.0" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">42.1</text><text x="400.0" y="236.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">NPU (QNN)</text><path d="M496.0,224.0 h68.6 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-68.6 z" fill="#1baf7a"/><text x="576.6" y="238.0" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">24.8</text><line x1="496.0" y1="128.0" x2="496.0" y2="264.0" stroke="#d1d9e0" stroke-width="1"/><text x="24.0" y="286.0" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">Data: execuserve/studies/2026-10-06-npu/sm8850-execuserve-cpu-gpu-runs.csv and -qnn-runs.csv.</text></svg>
