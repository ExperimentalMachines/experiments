<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406" role="img" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif"><title>Second-turn prompt read with the cache kept and reset, five phones</title><desc>POCO X8 Pro Max: 111 ms kept, 3822 ms reset, 34.5x; Galaxy S25 Ultra: 70 ms kept, 2842 ms reset, 40.2x; Galaxy Tab S10+: 80 ms kept, 3299 ms reset, 40.9x; Galaxy S24: 112 ms kept, 3884 ms reset, 33.0x; Pixel 9: 276 ms kept, 8691 ms reset, 30.0x</desc><text x="24.0" y="34.0" font-size="17" font-weight="600" fill="#f0f6fc" text-anchor="start">Keeping the cache makes the next turn 30 to 41 times faster</text><text x="24.0" y="56.0" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Second turn of a ~1,000-token chat, LFM2.5 1.2B on ExecuTorch, greedy. Median of 8 to 12 pairs.</text><circle cx="29.0" cy="82.0" r="7" fill="#0d1117"/><circle cx="29.0" cy="82.0" r="5" fill="#3987e5"/><text x="40.0" y="86.0" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Cache kept: reads the 20 new tokens</text><circle cx="321.8" cy="82.0" r="7" fill="#0d1117"/><circle cx="321.8" cy="82.0" r="5" fill="#d95926"/><text x="332.8" y="86.0" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Cache reset: reads all ~1,000 tokens</text><line x1="236.0" y1="104.0" x2="236.0" y2="344.0" stroke="#262c36" stroke-width="1"/><text x="236.0" y="360.0" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle" style="font-variant-numeric:tabular-nums">50</text><line x1="287.8" y1="104.0" x2="287.8" y2="344.0" stroke="#262c36" stroke-width="1"/><text x="287.8" y="360.0" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle" style="font-variant-numeric:tabular-nums">100</text><line x1="339.6" y1="104.0" x2="339.6" y2="344.0" stroke="#262c36" stroke-width="1"/><text x="339.6" y="360.0" font-size="11" font-weight="400" fill="#919