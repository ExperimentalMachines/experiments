<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif"><title>Experiments</title><desc>20 studies, 17 devices, 5762 files</desc><rect x="24" y="30" width="4" height="96" rx="2" fill="#3987e5"/><text x="44.0" y="72.0" font-size="40" font-weight="700" fill="#f0f6fc" text-anchor="start">Experiments</text><text x="44.0" y="104.0" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">What it really takes to run open-weight language models on a phone,</text><text x="44.0" y="124.0" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">measured on real devices, with the scripts and every run file kept.</text><text x="44.0" y="176.0" font-size="24" font-weight="700" fill="#f0f6fc" text-anchor="start">20</text><text x="44.0" y="196.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">studies</text><text x="139.0" y="176.0" font-size="24" font-weight="700" fill="#f0f6fc" text-anchor="start">17</text><text x="139.0" y="196.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">phones, tablets and emulators</text><text x="381.9" y="176.0" font-size="24" font-weight="700" fill="#f0f6fc" text-anchor="start">5,762</text><text x="381.9" y="196.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">run and evidence files</text></svg>
